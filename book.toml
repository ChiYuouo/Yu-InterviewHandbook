[book]
title = "JavaGuide"
authors = ["Snailclimb"]
description = "Java 面试与后端知识体系。内容来自 Apache-2.0 许可的 JavaGuide 开源文档。"
language = "zh"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/Snailclimb/JavaGuide"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
additional-css = ["theme/sidebar.css"]
additional-js = ["theme/sidebar.js"]

[output.html.fold]
enable = true
level = 0

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
